content_planning_task_audio_driven:
  description: >
    This video is AUDIO-DRIVEN. The narrative is carried by dialogue and speech.
    You are given a master timeline where each entry contains a scene's start_time,
    end_time, visual scores (motion_intensity, emotional_intensity, composition_quality),
    scene_description, and overlapping transcription: {master_timeline}

    Your goal is to find the most complete, self-contained story in the source material
    that fits within 60 seconds. A viewer with no prior context must be able to watch
    it and fully understand what is happening — who, what, and why.

    How to select:
    - Identify the strongest narrative arc in the material: a clear hook, the context
      needed to understand the situation, and a resolution or conclusion.
    - Include all segments necessary to make that arc coherent. Do not cut setup or
      context just to be shorter. Use as much of the 60 seconds as the story needs.
    - Only omit segments that are genuinely redundant or unrelated to the arc.

    SPLITTING RULE: Only create multiple parts if there are two or more clearly
    distinct, self-contained stories each worth their own video. If in doubt, output
    one part. Add up the total duration — if 60 seconds or less, output ONE part.

    Never cut mid-sentence or mid-word.
  expected_output: >
    One or more video parts (usually just one), each containing segments with
    start_time and end_time that form a complete, self-contained narrative within
    60 seconds.
  agent: content_planner

content_planning_task_visual_driven:
  description: >
    This video is VISUALLY-DRIVEN. Prioritize scene scores when selecting segments.
    You are given a master timeline where each entry contains a scene's start_time,
    end_time, visual scores (motion_intensity, emotional_intensity, composition_quality),
    scene_description, and overlapping transcription: {master_timeline}

    Your goal is to find the most complete, self-contained story in the source material
    that fits within 60 seconds. A viewer with no prior context must be able to watch
    it and fully understand what is happening — who, what, and why.

    How to select:
    - Identify the strongest narrative arc using visual scores as the primary guide.
      Look for a clear hook, the context needed to understand the situation, and a
      resolution or conclusion.
    - Include all segments necessary to make that arc coherent. Use the transcription
      field to preserve spoken context that helps the viewer understand the visuals.
      Do not cut setup or context just to be shorter. Use as much of the 60 seconds
      as the story needs.
    - Only omit segments that are genuinely redundant or unrelated to the arc.

    SPLITTING RULE: Only create multiple parts if there are two or more clearly
    distinct, self-contained stories each worth their own video. If in doubt, output
    one part. Add up the total duration — if 60 seconds or less, output ONE part.

    Never cut mid-sentence or mid-word.
  expected_output: >
    One or more video parts (usually just one), each containing segments with
    start_time and end_time that form a complete, self-contained narrative within
    60 seconds.
  agent: content_planner
