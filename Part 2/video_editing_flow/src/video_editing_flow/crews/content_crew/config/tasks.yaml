scene_scoring_task:
  description: >
    Score each scene using the scene scoring tool with the following scene timestamps: {scene_timestamps}.
    Use the exact frame_file_path values from those timestamps — do not guess or make up paths.
    Create scores for motion intensity, emotional intensity and composition quality.
    Also create a detailed description of each scene so downstream agents can
    reference which scenes are pivotal in telling the full story.
  expected_output: >
    List of scenes with scores on motion intensity, emotional intensity, composition
    quality and scenes description which is well structured and descriptive.
  agent: scene_scorer

content_planning_task:
  description: >
    Create a plan with timestamps of the segments that will be included in the final video.
    Use the scene scores from the previous task and the following transcription to inform your decisions: {transcriptions}.

    Take consideration of which part of the video will hook the viewers the most and which
    style of editing would make sense for the platform the video will be uploaded to.
    Fit the video within the time limit of the platform but don't try to make it as long
    as possible. The goal is to catch the attention of viewers for as long as possible.

    IMPORTANT: start_time and end_time must always align exactly with the start and end
    of a complete sentence from the transcription. Never cut in the middle of a sentence
    or word. Use the transcription timestamps to ensure every segment begins and ends
    at a sentence boundary.
  expected_output: >
    List of segments with timestamps that will be included in the final video,
    where every start and end time aligns with a sentence boundary from the transcription.
  agent: content_planner
