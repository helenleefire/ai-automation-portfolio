content_planning_task_audio_driven:
  description: >
    This video is AUDIO-DRIVEN. The narrative is carried by dialogue and speech.
    You are given a master timeline where each entry contains a scene's start_time,
    end_time, visual scores (motion_intensity, emotional_intensity, composition_quality),
    scene_description, and overlapping transcription: {master_timeline}

    Prioritize keeping complete, coherent spoken segments. Select entries whose
    transcription contains impactful, coherent dialogue. Use visual scores only as
    a tiebreaker between equally strong spoken moments.

    The final video must be at most 60 seconds total. Output only the start_time and
    end_time for each selected segment. Never cut mid-sentence or mid-word.
  expected_output: >
    List of segments with start_time and end_time that preserve complete spoken
    moments, where every boundary aligns with a sentence end.
  agent: content_planner

content_planning_task_visual_driven:
  description: >
    This video is VISUALLY-DRIVEN. Prioritize scene scores when selecting segments.
    You are given a master timeline where each entry contains a scene's start_time,
    end_time, visual scores (motion_intensity, emotional_intensity, composition_quality),
    scene_description, and overlapping transcription: {master_timeline}

    Select the most visually impactful segments based on motion_intensity,
    emotional_intensity, and composition_quality. Use the transcription field to
    avoid cutting mid-sentence.

    The final video must be at most 60 seconds total. Output only the start_time and
    end_time for each selected segment. Never cut mid-sentence or mid-word.
  expected_output: >
    List of segments with start_time and end_time preserving the most visually
    impactful moments, where every boundary aligns with a sentence end.
  agent: content_planner
